[project]
name = 'wwricu'
description = 'wwr.icu api service'
requires-python = '>=3.13'
version = '0.0.0'

dependencies = [
    'aiosqlite~=0.22.1',
    "apscheduler~=3.11.3",
    'bcrypt~=5.0.0',
    "beautifulsoup4~=4.15.0",
    'boto3==1.43.118',
    "boto3-stubs[s3]==1.43.118",
    "fastapi==0.162.0",
    "httpx2~=2.16.0",
    'loguru~=0.7.3',
    "pydantic_settings~=2.16.3",
    "pyotp~=2.10.0",
    "python-dotenv~=1.2.1",
    "python-multipart~=0.0.22",
    "sqlalchemy[asyncio]~=2.1.6",
    "uvicorn[standard]~=0.54.0",
]

[tool.setuptools.packages.find]
include = ['wwricu*']

[tool.setuptools.package-dir]
wwricu = 'wwricu'

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ['E712']

[dependency-groups]
dev = [
    "fastapi-cli==0.0.32",
    "mypy==2.4.0",
    'pytest==9.1.1',
    'pytest-asyncio==1.4.0',
    "ruff==0.17.2",
]
