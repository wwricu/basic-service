[project]
name = 'wwricu'
description = 'wwr.icu api service'
requires-python = '>=3.13'
version = '0.0.0'

dependencies = [
    'aiosqlite~=0.22.1',
    "apscheduler~=3.11.3",
    'bcrypt~=5.0.0',
    "beautifulsoup4~=4.15.0",
    'boto3~=1.43.127',
    "boto3-stubs[s3]~=1.43.127",
    "fastapi==0.165.0",
    "httpx2~=2.16.2",
    'loguru~=0.8.0',
    "pydantic_settings~=2.16.3",
    "pyotp~=2.12.1",
    "python-dotenv~=1.2.4",
    "python-multipart~=0.0.34",
    "sqlalchemy[asyncio]~=2.1.9",
    "uvicorn[standard]~=0.54.0",
]

[tool.setuptools.packages.find]
include = ['wwricu*']

[tool.setuptools.package-dir]
wwricu = 'wwricu'

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ['B008', 'C408', 'E712', 'I001']

[dependency-groups]
dev = [
    "fastapi-cli==0.0.34",
    "mypy==2.4.1",
    'pytest==9.2.0',
    'pytest-asyncio==1.5.0',
    "ruff==0.17.6",
]
